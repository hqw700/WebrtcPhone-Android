name: Build & Test

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Fetch Agent Binaries from ScrcpyOverWebRTC Release
        run: |
          mkdir -p app/src/main/assets
          echo "Querying latest release from hqw700/ScrcpyOverWebRTC..."
          LATEST_TAG=$(curl -sSL "https://api.github.com/repos/hqw700/ScrcpyOverWebRTC/releases/latest" | grep '"tag_name":' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$LATEST_TAG" ]; then
            echo "Failed to query latest tag, fallback to v0.4.1"
            LATEST_TAG="v0.4.1"
          fi
          ZIP_URL="https://github.com/hqw700/ScrcpyOverWebRTC/releases/download/${LATEST_TAG}/cloudphone-${LATEST_TAG}.zip"
          echo "Downloading agent bundle from $ZIP_URL..."
          if curl -fL -o /tmp/cloudphone.zip "$ZIP_URL"; then
            unzip -q -o /tmp/cloudphone.zip -d /tmp/cloudphone_extracted
            if [ -d "/tmp/cloudphone_extracted/agentd" ]; then
              cp /tmp/cloudphone_extracted/agentd/cloudphone-agent-* app/src/main/assets/ || true
              cp /tmp/cloudphone_extracted/agentd/libsys_core.so app/src/main/assets/ || true
              echo "Agent binaries downloaded and extracted successfully:"
              ls -la app/src/main/assets/
            fi
          else
            echo "Failed to download release zip, continuing in client-only mode."
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Decode Keystore (Optional)
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret detected, decoding..."
            mkdir -p "$RUNNER_TEMP/keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
            echo "keystore_path=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_OUTPUT"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret configured, skipping release signing."
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK (If Keystore Configured)
        if: steps.decode_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_FILE: ${{ steps.decode_keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WebrtcPhone-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload Test Reports (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Create GitHub Release (On Tag)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
